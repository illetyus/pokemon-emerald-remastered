name: R0 Android ARM64

on:
  push:
    branches:
      - remaster/**
    paths:
      - "core/**"
      - "experiments/sdl3-native/**"
      - "experiments/godot-bridge/**"
      - "CMakeLists.txt"
      - ".github/workflows/r0-android-arm64.yml"

concurrency:
  group: r0-android-arm64-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: "29.0.14206865"
  ANDROID_PLATFORM: "android-24"

jobs:
  sdl3-arm64:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android NDK
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"             "ndk;$NDK_VERSION"             "platforms;android-35"             "build-tools;35.0.1"

      - name: Configure SDL3 ARM64
        shell: bash
        run: |
          cmake -S . -B build-android-sdl             -DREMASTER_BUILD_SDL3=ON             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/$NDK_VERSION/build/cmake/android.toolchain.cmake"             -DANDROID_ABI=arm64-v8a             -DANDROID_PLATFORM="$ANDROID_PLATFORM"             -DSDL_ANDROID_HOME="$ANDROID_HOME"

      - name: Build SDL3 ARM64 native library
        run: cmake --build build-android-sdl --target main -j 2

      - name: Stage SDL3 ARM64 artifact
        shell: bash
        run: |
          mkdir -p artifacts/sdl3-arm64
          find build-android-sdl -name 'libmain.so' -print -exec cp {} artifacts/sdl3-arm64/ \;
          test -f artifacts/sdl3-arm64/libmain.so
          file artifacts/sdl3-arm64/libmain.so

      - name: Upload SDL3 ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: r0-sdl3-android-arm64
          path: artifacts/sdl3-arm64/libmain.so
          if-no-files-found: error

  godot-bridge-arm64:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android NDK
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"             "ndk;$NDK_VERSION"             "platforms;android-35"             "build-tools;35.0.1"

      - name: Configure Godot bridge ARM64
        shell: bash
        run: |
          cmake -S . -B build-android-godot             -DREMASTER_BUILD_GODOT_BRIDGE=ON             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/$NDK_VERSION/build/cmake/android.toolchain.cmake"             -DANDROID_ABI=arm64-v8a             -DANDROID_PLATFORM="$ANDROID_PLATFORM"

      - name: Build Godot bridge ARM64 native library
        run: cmake --build build-android-godot --target remaster_core_bridge -j 2

      - name: Stage Godot bridge ARM64 artifact
        shell: bash
        run: |
          mkdir -p artifacts/godot-bridge-arm64
          cp experiments/godot-bridge/bin/android/arm64-v8a/libremaster_core_bridge.so artifacts/godot-bridge-arm64/
          file artifacts/godot-bridge-arm64/libremaster_core_bridge.so

      - name: Upload Godot bridge ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: r0-godot-bridge-android-arm64
          path: artifacts/godot-bridge-arm64/libremaster_core_bridge.so
          if-no-files-found: error

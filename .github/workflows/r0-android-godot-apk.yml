name: R0 Android Godot APK

on:
  push:
    branches:
      - remaster/**
    paths:
      - "core/**"
      - "experiments/godot-bridge/**"
      - ".github/workflows/r0-android-godot-apk.yml"

concurrency:
  group: r0-android-godot-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm64-apk:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    env:
      XDG_DATA_HOME: ${{ github.workspace }}/.godot-data

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install pinned Android SDK components
        shell: bash
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "ndk;28.1.13356709"

      - name: Configure Android ARM64 bridge
        shell: bash
        run: |
          NDK="${ANDROID_HOME}/ndk/28.1.13356709"
          cmake -S . -B build-android-godot-apk \
            -DREMASTER_BUILD_GODOT_BRIDGE=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static

      - name: Build Android ARM64 GDExtension
        run: cmake --build build-android-godot-apk --target remaster_core_bridge -j 2

      - name: Download pinned Godot editor
        shell: bash
        run: |
          curl -L --fail --retry 3 \
            -o godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  godot.zip" | sha256sum -c -
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64

      - name: Install pinned Godot export templates
        shell: bash
        run: |
          curl -L --fail --retry 3 \
            -o templates.tpz \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          echo "f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011  templates.tpz" | sha256sum -c -
          rm -rf templates-unpack
          mkdir -p templates-unpack
          unzip -q templates.tpz -d templates-unpack
          DEST="$XDG_DATA_HOME/godot/export_templates/4.7.2.stable"
          mkdir -p "$DEST"
          cp -a templates-unpack/templates/. "$DEST/"
          test -f "$DEST/android_debug.apk"

      - name: Create CI debug keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Export Godot bridge ARM64 debug APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ env.HOME }}/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p experiments/godot-bridge/build
          ./Godot_v4.7.2-stable_linux.x86_64 \
            --headless \
            --path experiments/godot-bridge \
            --export-debug "Android ARM64 Debug" \
            build/r0-godot-bridge-debug.apk

      - name: Verify Godot APK contents
        shell: bash
        run: |
          APK="experiments/godot-bridge/build/r0-godot-bridge-debug.apk"
          test -f "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libgodot_android.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libremaster_core_bridge.so'

      - name: Publish Godot R0 APK
        uses: actions/upload-artifact@v4
        with:
          name: r0-godot-bridge-android-arm64-apk
          path: experiments/godot-bridge/build/r0-godot-bridge-debug.apk
          if-no-files-found: error

name: R4 Overworld

on:
  push:
    branches:
      - main
      - remaster/r4-**
  pull_request:
    branches:
      - main

concurrency:
  group: r4-overworld-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-overworld:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build R4 acceptance targets
        run: >-
          cmake --build build --config Release --target
          emerald_overworld_step_test
          emerald_object_runtime_test
          emerald_step_events_test
          r4_littleroot_overworld_test

      - name: Run R4 acceptance
        run: >-
          ctest --test-dir build -C Release
          -R "emerald_overworld_player_step|emerald_runtime_object_collision|emerald_step_event_ordering|r4_littleroot_overworld"
          --output-on-failure

      - name: Validate full-world runtime object capacity
        run: python -m unittest tests/test_r4_runtime_object_capacity.py -v

      - name: Validate Unreal R4 adapter architecture
        run: python tools/validate_unreal_source.py

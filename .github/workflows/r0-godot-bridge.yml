name: R0 Godot Bridge

on:
  push:
    branches:
      - remaster/**
    paths:
      - "core/**"
      - "experiments/godot-bridge/**"
      - "CMakeLists.txt"
      - ".github/workflows/r0-godot-bridge.yml"

concurrency:
  group: r0-godot-bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-bridge-test:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure bridge
        run: cmake -S . -B build-bridge -DREMASTER_BUILD_GODOT_BRIDGE=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build bridge
        run: cmake --build build-bridge --config Release --target remaster_core_bridge -j 2

      - name: Download Godot 4.7.2
        shell: bash
        run: |
          curl -L --fail --retry 3             -o godot.zip             https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  godot.zip" | sha256sum -c -
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64

      - name: Initialize Godot project and discover extension
        run: |
          ./Godot_v4.7.2-stable_linux.x86_64 \
            --headless \
            --editor \
            --quit-after 2 \
            --path experiments/godot-bridge

      - name: Run Godot+C bridge equivalence test
        run: |
          ./Godot_v4.7.2-stable_linux.x86_64             --headless \
            --quit-after 1 \
            --path experiments/godot-bridge             --script res://tests/r0_headless.gd

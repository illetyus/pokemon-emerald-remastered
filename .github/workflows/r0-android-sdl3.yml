name: R0 Android SDL3

on:
  push:
    branches:
      - remaster/**
    paths:
      - "core/**"
      - "experiments/sdl3-native/**"
      - ".github/workflows/r0-android-sdl3.yml"

concurrency:
  group: r0-android-sdl3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm64-apk:
    timeout-minutes: 20
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install pinned Android SDK components
        shell: bash
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"             "platform-tools"             "platforms;android-35"             "build-tools;35.0.1"             "ndk;28.1.13356709"

      - name: Download pinned SDL3 source
        shell: bash
        run: |
          curl -L --fail --retry 3             -o SDL3.tar.gz             https://github.com/libsdl-org/SDL/releases/download/release-3.4.16/SDL3-3.4.16.tar.gz
          echo "7322236cd12090c3eb40b9728be4d49c76f66ad17d04369584d4ecad5cf77c68  SDL3.tar.gz" | sha256sum -c -
          tar -xzf SDL3.tar.gz

      - name: Generate SDL3 Android project
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.1.13356709
        run: |
          SDL_ROOT="$(find . -maxdepth 1 -type d -name 'SDL3-*' | head -n 1)"
          test -n "$SDL_ROOT"
          python "$SDL_ROOT/build-scripts/create-android-project.py"             --variant copy             --output "$GITHUB_WORKSPACE/build-android-sdl"             com.illetyus.emeraldremaster.r0sdl             "$GITHUB_WORKSPACE/experiments/sdl3-native/main.c"             "$GITHUB_WORKSPACE/core/src/core.c"

          PROJECT="$GITHUB_WORKSPACE/build-android-sdl/com.illetyus.emeraldremaster.r0sdl"
          cp "$GITHUB_WORKSPACE/core/include/remaster/core.h" "$PROJECT/app/jni/src/core.h"
          sed -i 's#"remaster/core.h"#"core.h"#g' "$PROJECT/app/jni/src/main.c" "$PROJECT/app/jni/src/core.c"
          sed -i 's/ndkVersion = "28.2.13676358"/ndkVersion = "28.1.13356709"/' "$PROJECT/app/build.gradle"

      - name: Build ARM64 debug APK
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.1.13356709
        run: |
          PROJECT="$GITHUB_WORKSPACE/build-android-sdl/com.illetyus.emeraldremaster.r0sdl"
          cd "$PROJECT"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK native libraries
        shell: bash
        run: |
          APK="$GITHUB_WORKSPACE/build-android-sdl/com.illetyus.emeraldremaster.r0sdl/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libmain.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libSDL3.so'

      - name: Publish SDL3 R0 APK
        uses: actions/upload-artifact@v4
        with:
          name: r0-sdl3-android-arm64
          path: build-android-sdl/com.illetyus.emeraldremaster.r0sdl/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

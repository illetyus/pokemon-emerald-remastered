name: R0 Android Godot Bridge

on:
  push:
    branches:
      - remaster/**
    paths:
      - "core/**"
      - "experiments/godot-bridge/**"
      - "CMakeLists.txt"
      - ".github/workflows/r0-android-godot-bridge.yml"

concurrency:
  group: r0-android-godot-bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm64-extension:
    timeout-minutes: 20
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install pinned Android NDK
        shell: bash
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"             "platforms;android-35"             "build-tools;35.0.1"             "ndk;28.1.13356709"

      - name: Configure Android ARM64 bridge
        shell: bash
        run: |
          NDK="${ANDROID_HOME}/ndk/28.1.13356709"
          cmake -S . -B build-android-godot             -DREMASTER_BUILD_GODOT_BRIDGE=ON             -DCMAKE_BUILD_TYPE=Debug             -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake"             -DANDROID_ABI=arm64-v8a             -DANDROID_PLATFORM=android-24             -DANDROID_STL=c++_static

      - name: Build Android ARM64 GDExtension
        run: cmake --build build-android-godot --target remaster_core_bridge -j 2

      - name: Verify ARM64 shared library
        shell: bash
        run: |
          LIB="experiments/godot-bridge/bin/android/arm64-v8a/libremaster_core_bridge.so"
          test -f "$LIB"
          file "$LIB"
          readelf -h "$LIB" | grep -E 'AArch64|ARM64'

      - name: Publish Godot bridge ARM64 library
        uses: actions/upload-artifact@v4
        with:
          name: r0-godot-bridge-android-arm64
          path: experiments/godot-bridge/bin/android/arm64-v8a/libremaster_core_bridge.so
          if-no-files-found: error

name: BrowserStack Android Smoke

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      apk_path:
        description: Absolute or workspace-relative path to the APK on the self-hosted runner
        required: true
        type: string
      device_name:
        description: BrowserStack real Android device name
        required: true
        default: Google Pixel 8
        type: string
      os_version:
        description: BrowserStack Android OS version
        required: true
        default: "14.0"
        type: string
      wait_seconds:
        description: Seconds to keep the app running before collecting logs
        required: true
        default: "45"
        type: string
      enforce_markers:
        description: Require every REM_SMOKE marker in device logs
        required: true
        default: false
        type: boolean

jobs:
  real-device-smoke:
    runs-on: [self-hosted, windows, unreal-5.8, android]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Resolve APK
        id: apk
        shell: pwsh
        run: |
          $candidate = "${{ inputs.apk_path }}"
          if ([System.IO.Path]::IsPathRooted($candidate)) {
            $resolved = $candidate
          } else {
            $resolved = Join-Path $env:GITHUB_WORKSPACE $candidate
          }

          if (-not (Test-Path -LiteralPath $resolved -PathType Leaf)) {
            throw "APK not found: $resolved"
          }

          $resolved = (Resolve-Path -LiteralPath $resolved).Path
          "path=$resolved" >> $env:GITHUB_OUTPUT

      - name: Verify BrowserStack secret source
        shell: pwsh
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: |
          $direct = (
            -not [string]::IsNullOrWhiteSpace($env:BROWSERSTACK_USERNAME) -and
            -not [string]::IsNullOrWhiteSpace($env:BROWSERSTACK_ACCESS_KEY)
          )

          if ($direct) {
            Write-Host "BrowserStack credentials are available from GitHub/Doppler sync."
            exit 0
          }

          if ([string]::IsNullOrWhiteSpace($env:DOPPLER_TOKEN)) {
            throw "No BrowserStack credentials and no DOPPLER_TOKEN are available."
          }

          if (-not (Get-Command doppler -ErrorAction SilentlyContinue)) {
            throw "DOPPLER_TOKEN is available, but Doppler CLI is not installed on the runner."
          }

          Write-Host "BrowserStack credentials will be injected by Doppler CLI."

      - name: Run BrowserStack real-device smoke
        shell: pwsh
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          ENFORCE_MARKERS: ${{ inputs.enforce_markers }}
        run: |
          $args = @(
            "tools/browserstack_smoke.py",
            "--apk", "${{ steps.apk.outputs.path }}",
            "--device", "${{ inputs.device_name }}",
            "--os-version", "${{ inputs.os_version }}",
            "--wait-seconds", "${{ inputs.wait_seconds }}"
          )

          if ($env:ENFORCE_MARKERS -ne "true") {
            $args += "--skip-marker-check"
          }

          $direct = (
            -not [string]::IsNullOrWhiteSpace($env:BROWSERSTACK_USERNAME) -and
            -not [string]::IsNullOrWhiteSpace($env:BROWSERSTACK_ACCESS_KEY)
          )

          if ($direct) {
            python @args
            exit $LASTEXITCODE
          }

          doppler run -- python @args
          exit $LASTEXITCODE

      - name: Publish BrowserStack smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browserstack-android-smoke
          path: artifacts/browserstack
          if-no-files-found: warn

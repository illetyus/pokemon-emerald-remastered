name: R7 Environment Presentation

permissions:
  contents: read

on:
  push:
    branches: [main, r7-environment-presentation, 'remaster/r7-**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: r7-environment-presentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: R7 source identities, full map audit, private import boundary
        run: python -m unittest discover -s tests -p 'test_r7*.py' -v
      - name: All Python source regressions
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build and verify deterministic metadata package
        run: |
          python tools/build_r7_environment_package.py vendor/vanillaplus /tmp/r7-package
          python tools/build_r7_environment_package.py vendor/vanillaplus /tmp/r7-package --verify
      - name: Validate Unreal authority boundaries
        run: python tools/validate_unreal_source.py
      - name: Public metadata evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r7-environment-metadata
          path: /tmp/r7-package
          if-no-files-found: error

  portable-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Configure source-backed catalogs
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Compile core, C++ embedding and shared presentation helpers
        run: cmake --build build --config Release --parallel 2
      - name: All portable regression gates
        run: ctest --test-dir build -C Release --output-on-failure

name: R16 Vanilla+ QoL

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - r16-**
  pull_request:
    branches:
      - main

concurrency:
  group: r16-qol-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qol-core:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: One-shot sync checked-in R11 catalog
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/r16-qol-closure' &&
          !contains(github.event.head_commit.message, '[r11-sync]')
        run: |
          cp build/generated/r11/emerald_domain_catalog.inc core/src/emerald_domain_catalog.inc
          if ! git diff --quiet -- core/src/emerald_domain_catalog.inc; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add core/src/emerald_domain_catalog.inc
            git commit -m 'chore(r16): sync generated domain catalog [r11-sync]'
            git push origin HEAD:r16-qol-closure
          fi

      - name: Build R16 targets
        run: >-
          cmake --build build --config Release --target
          emerald_qol_test
          unreal_cpp_embed_smoke

      - name: Run R16 regressions
        run: >-
          ctest --test-dir build -C Release
          -R "r16_qol_behavior|r16_qol_source_audit|unreal_cpp_embed"
          --output-on-failure

      - name: Audit pinned Vanilla+ QoL contract
        run: python -m unittest tests/test_r16_qol_source.py -v

      - name: Audit exhaustive R16 decision ledger
        run: python -m unittest tests/test_r16_qol_decisions.py -v

      - name: Run R16 closure RED gates
        run: python -m unittest tests/test_r16_qol_red.py -v

      - name: Validate Unreal source boundary
        run: python tools/validate_unreal_source.py

name: R10 Quest Map

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - remaster/r10-**
  pull_request:
    branches:
      - main

concurrency:
  group: r10-quest-map-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quest-contract:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build R10 portable and embed targets
        run: >-
          cmake --build build --config Release --target
          emerald_quest_test
          emerald_quest_save_test
          unreal_cpp_embed_smoke

      - name: Run R10 C regressions
        run: >-
          ctest --test-dir build -C Release
          -R "r10_quest_progression|r10_quest_save_roundtrip|unreal_cpp_embed"
          --output-on-failure

      - name: Audit R10 catalog against pinned Vanilla+
        run: python -m unittest tests/test_r10_quest_catalog.py -v

      - name: Validate Unreal presentation boundary
        run: python tools/validate_unreal_source.py

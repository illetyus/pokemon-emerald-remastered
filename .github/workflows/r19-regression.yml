name: R19 Regression Infrastructure

permissions:
  contents: read

on:
  push:
    branches: [main, r19-regression-infrastructure, 'remaster/r19-**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: r19-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Configure and compile actual portable authority
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel 2
      - name: R19 portable regression components
        run: ctest --test-dir build -R '^r19_' --output-on-failure --verbose
      - name: All portable regressions
        run: ctest --test-dir build --output-on-failure
      - name: Replay build artifact receipt
        env:
          REPLAY_CHECKOUT_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          root = Path('.')
          files = [Path('build/libremaster_core.a'),
                   Path('build/generated/r2_littleroot_generated.c'),
                   Path('build/generated/r4_littleroot_world_generated.c')]
          receipt = {
              'version': 1,
              'checkout_sha': os.environ['REPLAY_CHECKOUT_SHA'],
              'tree_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'source_commit': '70db90c9077aed1272e746fc2537d9f12b95a91c',
              'files': {str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in files},
              'core_source_blobs': subprocess.check_output(['git', 'ls-tree', '-r', 'HEAD', '--', 'core'], text=True).splitlines(),
              'scope': 'native replay build inputs after full CTest success; no UE/device result',
          }
          Path('build/r19-replay-build-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
      - name: Source-generated replay build inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r19-replay-build-inputs
          path: |
            build/libremaster_core.a
            build/generated/r2_littleroot_generated.c
            build/generated/r4_littleroot_world_generated.c
            build/r19-replay-build-receipt.json
          if-no-files-found: error

  source-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REMASTER_R15_REQUIRE_FFMPEG: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Required audio transform dependency
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: R19 orchestration regressions
        run: python -m unittest discover -s tests -p 'test_r19_*.py' -v
      - name: R6 R7 R14 R15 asset audit components
        run: python tools/r19_asset_audits.py
      - name: All Python regressions
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Unreal authority source guards
        run: python tools/validate_unreal_source.py

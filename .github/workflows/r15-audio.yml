name: R15 Audio Preparation

permissions:
  contents: read

on:
  push:
    branches: [main, r15-audio-modernization, 'remaster/r15-**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: r15-audio-modernization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REMASTER_R15_REQUIRE_FFMPEG: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install and verify required audio transform tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: R15 source identities and strict audio probes
        run: python -m unittest discover -s tests -p 'test_r15*.py' -v
      - name: All Python regressions including R10 R11 R16 R17
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Exact pinned-source audio audit
        run: |
          python tools/build_r15_audio_catalog.py --check
          python tools/build_r15_cry_modes.py --check
      - name: Unreal authority source guards
        run: python tools/validate_unreal_source.py

  portable-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Configure source-backed catalogs
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Compile core and the same audio policy used by Unreal
        run: cmake --build build --config Release --parallel 2
      - name: R15 policy tests and all portable regressions
        run: ctest --test-dir build -C Release --output-on-failure

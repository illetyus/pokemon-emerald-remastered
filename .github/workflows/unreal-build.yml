name: Unreal 5.8.3 Trusted PC Build

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      package_android:
        description: Package Android ARM64 development APK
        required: true
        default: true
        type: boolean

concurrency:
  group: unreal-58-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, linux, unreal-5.8]
    timeout-minutes: 180

    env:
      PROJECT: ${{ github.workspace }}/unreal/PokemonEmeraldRemastered.uproject

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Resolve Unreal Engine
        shell: bash
        run: |
          set -euo pipefail

          candidates=(
            "${UE_ROOT:-}"
            "/opt/UnrealEngine-5.8.3.3"
            "/opt/UnrealEngine"
            "$HOME/UnrealEngine-5.8.3"
            "$HOME/UnrealEngine"
          )

          for candidate in "${candidates[@]}"; do
            if [[ -n "$candidate" && -x "$candidate/Engine/Build/BatchFiles/Linux/Build.sh" ]]; then
              echo "UE_ROOT=$candidate" >> "$GITHUB_ENV"
              echo "Using Unreal Engine: $candidate"
              exit 0
            fi
          done

          echo "Unreal Engine 5.8.3 installation not found." >&2
          echo "Set UE_ROOT on the runner or install UE under /opt/UnrealEngine-5.8." >&2
          exit 1

      - name: Source and exact installation preflight
        shell: bash
        run: |
          set -euo pipefail
          args=(--engine-root "$UE_ROOT" --host Linux --receipt build/r18-installation-preflight.json)
          if [[ "${{ inputs.package_android }}" == "true" ]]; then args+=(--android); fi
          python tools/unreal_preflight.py "${args[@]}"

      - name: Generate and verify trusted production content
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_production_package.py --output unreal/Content/Generated --receipt build/r18-generation-receipt.json
          task_index_sha="$(python -c 'import json; print(json.load(open("build/r18-generation-receipt.json"))["index_sha256"])')"
          python tools/build_production_package.py --output unreal/Content/Generated --verify --expected-index-sha256 "$task_index_sha" --receipt build/r18-content-verification.json

      - name: Build Linux Development
        shell: bash
        run: |
          set -euo pipefail
          "$UE_ROOT/Engine/Build/BatchFiles/Linux/Build.sh"             PokemonEmeraldRemastered             Linux             Development             "-Project=$PROJECT"             -WaitMutex             -NoHotReloadFromIDE

      - name: Package Android ARM64 Development
        if: ${{ inputs.package_android }}
        shell: bash
        run: |
          set -euo pipefail

          archive="$GITHUB_WORKSPACE/artifacts/android"
          mkdir -p "$archive"

          "$UE_ROOT/Engine/Build/BatchFiles/RunUAT.sh" BuildCookRun             "-project=$PROJECT"             -noP4             -platform=Android             -clientconfig=Development             -build             -cook             -stage             -pak             -package             -archive             "-archivedirectory=$archive"

      - name: Verify Android package
        if: ${{ inputs.package_android }}
        shell: bash
        run: |
          set -euo pipefail

          apk="$(find "$GITHUB_WORKSPACE/artifacts/android" -type f -name '*.apk' -print -quit)"
          if [[ -z "$apk" ]]; then
            echo "No Android APK was produced." >&2
            exit 1
          fi

          echo "APK=$apk"
          sha256sum "$apk"

      # APK and commercial staged content remain on the private trusted runner.
      # Do not upload them as public-repository workflow artifacts.

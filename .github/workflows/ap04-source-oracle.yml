name: AP04 Source Initialization Oracle
on:
  push:
    branches: [main, ap04-game-session]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ap04-source-oracle-${{ github.ref }}
  cancel-in-progress: true
jobs:
  production-layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Layout parser and production-anchor negatives
        run: python -B tests/test_ap04_source_layout.py
      - name: Fetch pinned production AGBCC source
        run: |
          git init build/ap04-agbcc
          git -C build/ap04-agbcc remote add origin https://github.com/pret/agbcc.git
          git -C build/ap04-agbcc fetch --depth 1 origin da598c1d918402c42c0c0d7128ba14567f3175e9
          git -C build/ap04-agbcc checkout --detach FETCH_HEAD
          test "$(git -C build/ap04-agbcc rev-parse HEAD)" = da598c1d918402c42c0c0d7128ba14567f3175e9
      - name: Build fresh compiler and measure immutable source structs with MODERN=0
        run: python tools/ap04_source_layout.py --source . --agbcc build/ap04-agbcc --output build/ap04-layout
      - name: Source-only field measurement receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ap04-source-layout
          path: |
            build/ap04-layout/layout.json
            build/ap04-layout/probe.c
            build/ap04-layout/probe.s
            build/ap04-layout/compiler.log
            build/ap04-layout/preprocess.log
            build/ap04-layout/compiler-build.log
          if-no-files-found: error

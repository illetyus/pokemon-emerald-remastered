name: R0 SDL3

on:
  workflow_dispatch:

concurrency:
  group: r0-sdl3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    timeout-minutes: 10
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DREMASTER_BUILD_SDL3=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build SDL3 prototype
        run: cmake --build build --config Release --target r0_sdl3

      - name: Run SDL3 deterministic self-test
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Recurse -Filter r0_sdl3.exe | Select-Object -First 1
          if (-not $exe) { throw "r0_sdl3.exe not found" }
          & $exe.FullName --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

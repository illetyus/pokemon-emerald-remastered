name: BrowserStack Auth Probe

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  auth-probe:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}

    steps:
      - name: Verify BrowserStack credentials exist
        shell: bash
        run: |
          set -euo pipefail
          test -n "${BROWSERSTACK_USERNAME:-}" || {
            echo "BROWSERSTACK_USERNAME is not available to this workflow." >&2
            exit 1
          }
          test -n "${BROWSERSTACK_ACCESS_KEY:-}" || {
            echo "BROWSERSTACK_ACCESS_KEY is not available to this workflow." >&2
            exit 1
          }

      - name: Verify BrowserStack App Automate API authentication
        shell: bash
        run: |
          set -euo pipefail
          curl             --silent             --show-error             --fail-with-body             --max-time 30             --retry 2             --retry-all-errors             -u "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_KEY"             "https://api-cloud.browserstack.com/app-automate/plan.json"             -o /tmp/browserstack-plan.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/browserstack-plan.json").read_text())
          safe = {
              "automate_plan": payload.get("automate_plan"),
              "terminal_access": payload.get("terminal_access"),
              "parallel_sessions_running": payload.get("parallel_sessions_running"),
              "parallel_sessions_max_allowed": payload.get("parallel_sessions_max_allowed"),
              "queued_sessions": payload.get("queued_sessions"),
          }
          print(json.dumps(safe, indent=2))
          PY

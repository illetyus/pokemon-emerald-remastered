name: R0 Core

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - remaster/**
  pull_request:
    branches:
      - main

concurrency:
  group: r0-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  atomic-file-save-windows:
    timeout-minutes: 10
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build and test native atomic file transport
        shell: cmd
        run: |
          for /f "tokens=*" %%i in ('"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath') do call "%%i\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          cl /nologo /std:c++17 /EHsc /W4 /WX /I unreal\Source\PokemonEmeraldRemastered tests\r17_atomic_file_save_test.cpp /Fe:r17_atomic_file_save_test.exe
          if errorlevel 1 exit /b 1
          r17_atomic_file_save_test.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX /I core\include /I unreal\Source\PokemonEmeraldRemastered tests\r17_file_save_read_test.cpp /Fe:r17_file_save_read_test.exe
          if errorlevel 1 exit /b 1
          r17_file_save_read_test.exe
          if errorlevel 1 exit /b 1

  portable-core:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  scenario-schema:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate JSON fixtures
        run: python -m json.tool shared/scenarios/r0_walk_event_encounter.json > /dev/null


  world-converter:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Test world conversion pipeline
        run: python -m unittest tests/test_convert_world.py

      - name: Test R3 source catalog
        run: python -m unittest tests/test_r3_source_catalog.py -v

      - name: Test R3 script catalog
        run: python -m unittest tests/test_r3_script_catalog.py -v

      - name: Test R3 encounter conversion
        run: python -m unittest tests/test_convert_encounters.py -v

      - name: Test R3 package fingerprints
        run: python -m unittest tests/test_world_fingerprint.py -v

      - name: Test R4 runtime object capacity
        run: python -m unittest tests/test_r4_runtime_object_capacity.py -v

      - name: Test script conversion pipeline
        run: python -m unittest tests/test_convert_scripts.py tests/test_generate_script_c.py tests/test_r2_real_opening_source.py -v

      - name: Build real R2 opening native fixture
        run: python tools/build_r2_littleroot_fixture.py tests/fixtures/r2/vanillaplus_source /tmp/r2_littleroot_generated.c

      - name: Upload real R2 opening native fixture
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r2-littleroot-native-fixture
          path: /tmp/r2_littleroot_generated.c
          if-no-files-found: error

      - name: Test generated content audit
        run: python -m unittest tests/test_content_audit.py

      - name: Test platform coupling inventory
        run: python -m unittest tests/test_platform_coupling.py

      - name: Validate Unreal source architecture
        run: python tools/validate_unreal_source.py


  r3-full-world:
    timeout-minutes: 20
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run R3 full-Hoenn acceptance
        run: >-
          python tools/r3_full_world_probe.py
          --repo-root .
          --source-root vendor/vanillaplus
          --work-root /tmp/r3-full-world
          --evidence-root /tmp/r3-full-world-evidence

      - name: Upload R3 full-world evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r3-full-world-evidence
          path: /tmp/r3-full-world-evidence
          if-no-files-found: error

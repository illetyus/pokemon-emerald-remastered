name: R5 World Renderer

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - remaster/r5-**
  pull_request:
    branches:
      - main

concurrency:
  group: r5-world-renderer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  renderer-contract:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Checkout
        with:

      - name: Checkout
          persist-credentials: false

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build R5 renderer math targets
        run: >-
          cmake --build build --config Release --target
          r5_world_grid_test
          r5_metatile_render_test

      - name: Run R5 renderer math tests
        run: >-
          ctest --test-dir build -C Release
          -R "r5_world_grid_math|r5_metatile_render_math"
          --output-on-failure

      - name: Validate real R5 tileset source manifest
        run: python -m unittest tests/test_r5_tileset_manifest.py -v

      - name: Build R5 tileset source manifest
        run: >-
          python tools/build_r5_tileset_manifest.py
          vendor/vanillaplus
          /tmp/r5-tilesets.json

      - name: Upload R5 tileset source manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r5-tileset-source-manifest
          path: /tmp/r5-tilesets.json
          if-no-files-found: error

      - name: Decode real R5 metatile descriptors
        run: python -m unittest tests/test_r5_metatile_descriptors.py -v

      - name: Build R5 metatile descriptor artifact
        run: >-
          python tools/build_r5_metatile_descriptors.py
          vendor/vanillaplus
          /tmp/r5-metatiles.json

      - name: Upload R5 metatile descriptors
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r5-metatile-descriptors
          path: /tmp/r5-metatiles.json
          if-no-files-found: error

      - name: Validate package-safe R5 render payload
        run: python -m unittest tests/test_r5_render_package.py -v

      - name: Build packaged R5 render payload
        run: >-
          python tools/build_r5_render_package.py
          vendor/vanillaplus
          /tmp/r5-render-package

      - name: Upload packaged R5 render payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r5-render-package
          path: /tmp/r5-render-package
          if-no-files-found: error

      - name: Validate real R5 transition scene
        run: python -m unittest tests/test_r5_scene_acceptance.py -v

      - name: Build real R5 transition scene report
        run: >-
          python tools/build_r5_scene_acceptance.py
          vendor/vanillaplus
          /tmp/r5-scene-acceptance.json

      - name: Upload real R5 transition scene report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r5-scene-acceptance
          path: /tmp/r5-scene-acceptance.json
          if-no-files-found: error

      - name: Validate Unreal R5 renderer architecture
        run: python tools/validate_unreal_source.py
